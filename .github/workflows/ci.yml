name: ci

# The gates from DECISIONS.md #21 that apply to the whole repository rather
# than to one deployable. Path-filtered workflows deploy; this one guards.
#
# The reason it exists at all: the Gitleaks rule was written in M0 and caught
# nothing for three days, because nothing ran it. A rule that depends on
# somebody remembering is a description of a gate, not a gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  # -------------------------------------------------------------------------
  # MANDATORY. This repository is public and holds infrastructure code, so a
  # leaked credential is live the moment it is pushed.
  # -------------------------------------------------------------------------
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Gitleaks scans history, not just the working tree. A shallow clone
          # would silently scan one commit and report success — the failure
          # mode that let a phone number reach this repo in the first place.
          fetch-depth: 0

      # Installed from a pinned release rather than through the Gitleaks
      # action: one less third-party action with a token in this repository,
      # and the version is visible here rather than behind a tag.
      - name: install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: scan
        run: |
          # --redact prints the location of a finding without printing the
          # secret, so a failing run does not become a second leak in the logs.
          ./gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner

      # PDFs are a blind spot: Gitleaks matches raw bytes and PDF text lives in
      # compressed streams, so the phone-number rule cannot see inside one.
      # .gitignore blocks every PDF except site/public/resume.pdf; this checks
      # that the one exception is still clean, by extracting its text and
      # running the same pattern over it.
      - name: scan the résumé PDF's text layer
        run: |
          if [ ! -f site/public/resume.pdf ]; then
            echo "no résumé committed yet — nothing to check"
            exit 0
          fi
          pip install --quiet pypdf
          python - <<'PY'
          import re, sys
          from pypdf import PdfReader

          reader = PdfReader("site/public/resume.pdf")
          text = "\n".join((page.extract_text() or "") for page in reader.pages)
          text += "\n" + "\n".join(str(v) for v in (reader.metadata or {}).values())

          pattern = re.compile(r"(?:\+?63[\s.\-()]{0,3}|\b0)9\d{2}[\s.\-()]{0,2}\d{3}[\s.\-]?\d{4}\b")
          if pattern.search(text):
              print("FAIL: a phone number is present in the published résumé's text layer.")
              print("The web variant must have it removed, not merely covered over.")
              sys.exit(1)
          print(f"ok — {len(reader.pages)} page(s), no phone number in text or metadata")
          PY

  # -------------------------------------------------------------------------
  # MANDATORY. The site must build, and its links must resolve.
  # -------------------------------------------------------------------------
  site:
    name: build and link check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: build
        working-directory: site
        run: |
          npm ci
          npm run build

      # Internal links first, because lychee cannot check them. Given
      # --root-dir it resolves `/#about` to the site/dist DIRECTORY and looks
      # for an anchor inside it, which no directory has. This resolves `/` to
      # index.html the way a static host does, then verifies every fragment
      # exists — so a renamed section id fails the build instead of silently
      # scrolling nowhere.
      - name: internal links
        run: node scripts/links/check.mjs site/dist

      # DECISIONS.md #25 — the domain lives in astro.config.mjs and in Terraform,
      # and nowhere else. lychee.toml cannot compute, so the origin is read out
      # of the config here rather than written into that file as a third copy
      # that would rot silently the day the domain changes.
      - name: resolve the site's own origin
        run: |
          # String.fromCharCode(92) is a backslash. Written that way on purpose:
          # a literal one has to survive YAML, then bash, then the JavaScript
          # parser, and it does not — the dot came out unescaped, which would
          # quietly turn the exclusion into a wildcard.
          node -e 'import("./site/astro.config.mjs").then(m => { const o = new URL(m.default.site).origin; const esc = o.split(".").join(String.fromCharCode(92) + "."); process.stdout.write("SITE_ORIGIN_RE=^" + esc + "\n"); })' >> "$GITHUB_ENV"
          echo "excluding: $(tail -1 "$GITHUB_ENV")"

      # Checks the built HTML, not the source, so a link that only breaks after
      # rendering is still caught. External URLs and the markdown docs.
      - name: link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          # Settings live in lychee.toml. The EXCLUSIONS are here, because one
          # of them has to be computed and a list split across two files where
          # either half might silently win is worse than a list in one place.
          #
          # --root-dir must be an ABSOLUTE path and so cannot be committed to a
          # config file. It tells lychee what `/` means when it reads a built
          # page from disk. Without it every root-relative link is reported
          # unresolvable — the sidebar's /#about links, the hashed CSS, the
          # fonts, the resume — 71 errors on a site where every file exists.
          #
          # The three exclusions, in order:
          #
          # 1. The site's own origin. Every page carries a canonical URL
          #    pointing at itself, which lychee resolves over the network
          #    against the CURRENTLY DEPLOYED site — so any page that is new in
          #    this build 404s until the build ships. It failed the gate on
          #    every new page ever added while saying nothing about whether a
          #    link was correct. Same-site URLs, absolute and root-relative
          #    alike, are checked against site/dist by scripts/links/check.mjs
          #    in the step above. A handoff, not a suppression.
          # 2. LinkedIn answers automated requests with HTTP 999, a status code
          #    it invented, whether or not the profile exists. Nothing to
          #    verify; checked by hand when it changes, which is roughly never.
          # 3. The site root with a fragment — /#about and friends. With
          #    --root-dir, lychee resolves `/` to the site/dist DIRECTORY and
          #    looks for an anchor inside it; a directory has none, so all nine
          #    report a missing fragment. --fallback-extensions cannot fix it,
          #    as it only applies to paths that do not exist. Also handed off to
          #    check.mjs, which resolves `/` to index.html the way a host does.
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}/site/dist"
            --exclude "${{ env.SITE_ORIGIN_RE }}"
            --exclude "^https://(www\.)?linkedin\.com/"
            --exclude "^file://.*/site/dist#"
            'site/dist/**/*.html'
            'README.md'
            'DECISIONS.md'
            'PLAN.md'
            'docs/**/*.md'
          fail: true

  # -------------------------------------------------------------------------
  # ADVISORY (DECISIONS.md #21). Reported, never blocking. A performance budget
  # that fails a deploy on a third-party timing blip trains you to ignore it.
  # -------------------------------------------------------------------------
  lighthouse:
    name: lighthouse (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'

      # Run against the live site rather than a local preview: the numbers that
      # matter include CloudFront, compression and the real TLS handshake, none
      # of which a localhost run exercises.
      - name: audit
        run: |
          npx --yes lighthouse@12 https://joaqs.online/ \
            --quiet \
            --chrome-flags="--headless=new --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lh.json || true

          node -e '
            const r = require("./lh.json");
            const rows = Object.values(r.categories)
              .map(c => `${c.title.padEnd(16)} ${Math.round(c.score * 100)}`);
            console.log(rows.join("\n"));
          '
