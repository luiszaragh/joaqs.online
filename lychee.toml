# Link checker configuration. Runs in ci.yml as a blocking gate.
#
# Exclusions are triaged, never blanket — the same rule the Checkov skips in
# infra/ follow. Each one below states why the URL cannot be checked, so a
# future reader can tell "this is unverifiable" from "this was inconvenient".
#
# NOTE: `--root-dir` is NOT set here. It has to be an absolute path, which
# differs between a laptop and a runner, so ci.yml passes it. Without it every
# root-relative link (`/#about`, `/resume.pdf`, `/_astro/…`) is reported
# unresolvable — 71 false errors on a site where every target exists.
#
# Internal links are ALSO checked by scripts/links/check.mjs, and that is not
# redundant: see the exclusion at the bottom of this file for what lychee
# cannot do here.

# Fragments are checked, not just pages: the sidebar links to `/#about` and a
# renamed section id should fail the build rather than silently scroll nowhere.
#
# A string, not a boolean — the field takes none | anchor-only | text-only |
# full. `anchor-only` is what this site needs: it links to section ids, never
# to text fragments (`#:~:text=`), and asking for those would only add checks
# with nothing to match.
include_fragments = "anchor-only"

# Strings here, not integers — the field also accepts ranges like "200..=204",
# so every value is parsed as text.
#
# 200 and 206 are success. 429 is rate limiting: being throttled says nothing
# about whether a link works, and failing the build on it would make the gate
# flaky in exactly the way that teaches people to ignore it.
accept = ["200", "206", "429"]

max_retries = 3
no_progress = true

# NOTE: `exclude` is NOT set here either — the whole list lives in ci.yml,
# with the reasoning for each entry alongside it.
#
# It moved because one of the three entries has to be COMPUTED. Every page
# carries a canonical URL pointing at itself, and lychee resolves those over
# the network against the site as currently deployed — so a page that is new in
# this build has a canonical that 404s until the build ships. That failed the
# gate on every new page ever added while saying nothing about whether any link
# was correct. Excluding it needs the domain, and DECISIONS.md #25 allows the
# domain exactly two homes: astro.config.mjs and Terraform. ci.yml reads it
# from the first of those.
#
# The other two entries could have stayed here, but a list split across two
# files where either half might silently win is worse than a list in one place:
# lychee's precedence between a config array and a repeated CLI flag is not
# something this repo should be betting the LinkedIn exclusion on.

exclude_path = [
  # Binary font files. Nothing inside them is a link.
  "site/dist/fonts",
]
